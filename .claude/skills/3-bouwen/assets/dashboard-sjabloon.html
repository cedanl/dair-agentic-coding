<!doctype html>
<!-- Sjabloon voor het dashboard uit 3-bouwen. maak_dashboard.py vult elke plaatshouder
     (dollarteken plus naam) in met string.Template. Gebruik verder geen dollarteken in dit bestand. -->
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="keuzes" content="$keuzes">
<title>$titel</title>
<link rel="icon" href="$logo">
<style>$css</style>
</head><body>
<div class="$pagina">
<header class="npuls-hero">
<div><p class="npuls-label">$label</p><h1>$vraag</h1><p class="npuls-intro">$ondertitel</p></div>
<img class="npuls-logo" src="$logo" alt="Npuls">
</header>
<main>
<div class="npuls-balk">$demo $filter</div>
$blokken
<section class="npuls-zo-lees-je-dit" aria-labelledby="zo-lees-je-dit"><h2 id="zo-lees-je-dit">Zo lees je dit</h2>
<div class="npuls-uitlegkaarten">$zo_lees_je_dit</div></section>
</main>
<footer>$voet</footer>
</div>
<script>
// Toont alleen het blok bij de gekozen filterwaarden, en bij meer vergelijkingen alleen de gekozen vergelijking.
// Alle cijfers zijn vooraf berekend en door de privacydrempel gegaan: dit script rekent niets uit en leest geen data.
(function () {
  var filters = document.querySelectorAll("select[data-filterkeuze]");
  var wissel = document.querySelector("select[data-wissel]");
  var blokken = document.querySelectorAll("[data-filter]");
  var vergelijkingen = document.querySelectorAll("[data-uitsplitsing]");
  function toon() {
    var waarde = Array.prototype.map.call(filters, function (f) { return f.value; }).join("|") || "alle";
    blokken.forEach(function (blok) { blok.hidden = blok.getAttribute("data-filter") !== waarde; });
    vergelijkingen.forEach(function (view) { view.hidden = view.getAttribute("data-uitsplitsing") !== wissel.value; });
  }
  filters.forEach(function (f) { f.addEventListener("change", toon); });
  if (wissel) { wissel.addEventListener("change", toon); }
  toon();
})();
</script>
</body></html>
