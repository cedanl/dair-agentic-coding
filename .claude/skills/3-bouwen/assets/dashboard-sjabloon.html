<!doctype html>
<!-- Sjabloon voor het dashboard uit 3-bouwen. maak_dashboard.py vult elke plaatshouder
     (dollarteken plus naam) in met string.Template. Gebruik verder geen dollarteken in dit bestand. -->
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="keuzes" content="$keuzes">
<title>$titel</title>
<link rel="icon" href="$logo">
<style>$css</style>
</head><body>
<div class="$pagina">
<header class="npuls-hero">
<div><p class="npuls-label">$label</p><h1>$vraag</h1><p class="npuls-intro">$ondertitel</p></div>
<img class="npuls-logo" src="$logo" alt="Npuls">
</header>
<main>
<div class="npuls-balk">$demo $filter</div>
$blokken
<section class="npuls-zo-lees-je-dit" aria-labelledby="zo-lees-je-dit"><h2 id="zo-lees-je-dit">Zo lees je dit</h2>
<div class="npuls-uitlegkaarten">$zo_lees_je_dit</div></section>
</main>
<footer>$voet</footer>
</div>
<script>
// Toont alleen het blok bij de gekozen filterwaarden, en bij meer vergelijkingen alleen de gekozen vergelijking.
// Alle cijfers zijn vooraf berekend en door de privacydrempel gegaan: dit script rekent niets uit en leest geen data.
(function () {
  var filters = document.querySelectorAll("select[data-filterkeuze]");
  var wissel = document.querySelector("select[data-wissel]");
  var blokken = document.querySelectorAll("[data-filter]");
  function toon() {
    var waarde = Array.prototype.map.call(filters, function (f) { return f.value; }).join("|") || "alle";
    blokken.forEach(function (blok) {
      blok.hidden = blok.getAttribute("data-filter") !== waarde;
      // Een gekozen instroomjaar neemt de lijn over uit het blok zonder instroomjaar: die is voor elk jaar gelijk
      if (!blok.hidden) {
        blok.querySelectorAll("[data-lijn-van]").forEach(function (plek) {
          var bron = document.querySelector('[data-filter="' + plek.getAttribute("data-lijn-van") + '"] [data-jaarview]');
          if (!plek.firstChild && bron) { plek.appendChild(bron.cloneNode(true)); }
        });
      }
    });
    // style.display werkt ook voor de lijnen in de SVG, waar hidden niet werkt
    if (wissel) {
      document.querySelectorAll("[data-uitsplitsing]").forEach(function (view) {
        view.style.display = view.getAttribute("data-uitsplitsing") === wissel.value ? "" : "none";
      });
    }
  }
  filters.forEach(function (f) { f.addEventListener("change", toon); });
  if (wissel) { wissel.addEventListener("change", toon); }
  toon();
})();
// Vinkjes bij de lijn: een aangevinkte groep krijgt de eerste vrije kleur; zonder kleur is de lijn uit.
document.addEventListener("change", function (gebeurtenis) {
  var keuze = gebeurtenis.target.closest(".npuls-lijnkeuze");
  if (!keuze) { return; }
  var max = Number(keuze.getAttribute("data-max"));
  var view = keuze.closest(".npuls-view");
  var labels = keuze.querySelectorAll("label");
  var bezet = [];
  labels.forEach(function (l) { if (l.querySelector("input").checked && l.dataset.kleur) { bezet.push(l.dataset.kleur); } });
  labels.forEach(function (l) {
    var aan = l.querySelector("input").checked;
    if (!aan) { delete l.dataset.kleur; }
    if (aan && !l.dataset.kleur) {
      for (var k = 1; k <= max; k++) { if (bezet.indexOf(String(k)) < 0) { l.dataset.kleur = String(k); bezet.push(String(k)); break; } }
    }
    var lijn = view.querySelector('g.groep[data-lijn="' + l.dataset.lijn + '"]');
    if (lijn) { if (l.dataset.kleur) { lijn.setAttribute("data-kleur", l.dataset.kleur); } else { lijn.removeAttribute("data-kleur"); } }
  });
  labels.forEach(function (l) { var i = l.querySelector("input"); if (!i.checked) { i.disabled = bezet.length >= max; } });
});
</script>
</body></html>
