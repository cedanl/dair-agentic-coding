<!doctype html>
<!-- Sjabloon voor schets.html. maak_schets.py vult elke plaatshouder (dollarteken plus naam) in met
     string.Template. Gebruik verder geen dollarteken in dit bestand. -->
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="keuzes" content="$keuzes">
<title>Schets: $vraag</title>
<style>
:root{--bg:#fff;--fg:#000;--muted:#4b5563;--line:#d1d5db;--accent:#3d68ec;--vlak:#f3f4f6;--roze:#f4d9dc;--geel:#f4d74b}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;margin:0;padding:24px 16px 48px}
main{max-width:960px;margin:0 auto}
.kop{background:var(--roze);border-radius:24px;padding:32px}
.kop p.label{font-size:.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
h1{color:var(--accent);font-size:2.25rem;line-height:1.15;margin:0}
.kop p{margin:12px 0 0}
.demo{display:inline-block;background:var(--geel);border-radius:9999px;padding:6px 16px;font-weight:600;margin:16px 0 0}
h2{font-size:1.375rem;margin:32px 0 8px}
.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.view{border:1px solid var(--line);border-radius:20px;padding:20px}
.view h3{margin:0 0 8px;font-size:1.125rem}
.view .nr{display:inline-block;background:var(--accent);color:#fff;border-radius:9999px;padding:0 10px;font-size:.875rem;margin-right:6px}
figure{margin:12px 0;background:var(--vlak);border-radius:12px;padding:12px}
figcaption{color:var(--muted);font-size:.8125rem;margin-top:4px}
svg{width:100%;height:auto;display:block}svg .vorm{fill:var(--accent);opacity:.5}svg .lijn{stroke:var(--accent);stroke-width:3;fill:none}
svg .as{stroke:var(--line)}svg text{fill:var(--muted);font-size:11px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:.9375rem}dt{font-weight:600}dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:.9375rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
ul{padding-left:20px}
@media (max-width:600px){h1{font-size:1.625rem}.kop{padding:20px}dl{grid-template-columns:1fr}dd{margin-bottom:6px}}
</style></head><body><main>
<header class="kop"><p class="label">Schets van het dashboard</p><h1>$vraag</h1>
<p>$ondertitel</p>$demo</header>
<h2>De views</h2>
<div class="views">$views</div>
<h2>Keuzes</h2>
<table><thead><tr><th scope="col">Onderwerp</th><th scope="col">Keuze</th></tr></thead><tbody>$keuzes_tabel</tbody></table>
<h2>Wat dit dashboard niet kan zeggen</h2>
<ul>$niet</ul>
</main></body></html>
